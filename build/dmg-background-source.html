<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("../electron/ui/fonts/bebas-neue-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("../electron/ui/fonts/space-grotesk-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../electron/ui/fonts/jetbrains-mono-500.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 660px;
        height: 420px;
        margin: 0;
        overflow: hidden;
        background: #08080b;
      }
      .bg {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 12% 0%, rgba(255, 74, 36, 0.13), transparent 52%),
          radial-gradient(ellipse at 100% 100%, rgba(62, 62, 110, 0.14), transparent 55%),
          linear-gradient(160deg, #0e0e12 0%, #070709 100%);
      }
      .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.014) 3px,
          rgba(255, 255, 255, 0.014) 4px
        );
        pointer-events: none;
      }
      .brand {
        position: absolute;
        top: 38px;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
      }
      .seal {
        display: grid;
        place-items: center;
        width: 27px;
        height: 27px;
        border-radius: 50%;
        background: #ff4a24;
        color: #fff;
        font-family: "Bebas Neue";
        font-size: 19px;
        line-height: 1;
        box-shadow: 0 0 18px rgba(255, 74, 36, 0.35);
      }
      .brand-text {
        color: #f4f1ea;
        font-family: "JetBrains Mono";
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.19em;
      }
      .brand-text span {
        color: #ff4a24;
      }
      .eyebrow {
        position: absolute;
        top: 76px;
        left: 0;
        width: 100%;
        color: #6a6a74;
        font-family: "JetBrains Mono";
        font-size: 6.5px;
        letter-spacing: 0.22em;
        text-align: center;
      }
      .arrow {
        position: absolute;
        top: 208px;
        left: 240px;
        width: 180px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 74, 36, 0.55));
      }
      .arrow::after {
        content: "";
        position: absolute;
        top: -3px;
        right: 0;
        width: 7px;
        height: 7px;
        border-top: 1px solid rgba(255, 74, 36, 0.8);
        border-right: 1px solid rgba(255, 74, 36, 0.8);
        transform: rotate(45deg);
      }
      .drag {
        position: absolute;
        top: 172px;
        left: 240px;
        width: 180px;
        color: #8c8c96;
        font-family: "JetBrains Mono";
        font-size: 6.5px;
        letter-spacing: 0.18em;
        text-align: center;
        text-transform: uppercase;
      }
      .hint {
        position: absolute;
        top: 322px;
        left: 0;
        width: 100%;
        color: #5f5f68;
        font-family: "Space Grotesk";
        font-size: 9px;
        text-align: center;
      }
      .hint b {
        color: #a7a7b0;
        font-weight: 500;
      }
      .footer {
        position: absolute;
        right: 26px;
        bottom: 20px;
        left: 26px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #55555d;
        font-family: "JetBrains Mono";
        font-size: 6.5px;
        letter-spacing: 0.1em;
      }
      .footer b {
        color: #f4f1ea;
        font-weight: 500;
      }
      .footer .version {
        color: #6a6a74;
      }
      .sun {
        position: absolute;
        top: -150px;
        right: -130px;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        border: 1px solid rgba(255, 74, 36, 0.1);
        box-shadow: inset 0 0 120px rgba(255, 74, 36, 0.06);
      }
      .sun::after {
        content: "";
        position: absolute;
        inset: 40px;
        border-radius: 50%;
        border: 1px dashed rgba(255, 74, 36, 0.09);
      }
    </style>
  </head>
  <body>
    <div class="bg">
      <span class="sun"></span>
      <div class="brand">
        <span class="seal">S</span>
        <span class="brand-text">SOSUKE<span>/</span>CHECKER</span>
      </div>
      <p class="eyebrow">USERNAME INTELLIGENCE · 17 LIVE TARGETS</p>
      <p class="drag">drag to applications</p>
      <span class="arrow"></span>
      <p class="hint">Move <b>SOSUKE Checker</b> into Applications, then launch it.</p>
      <div class="footer">
        <span>built by <b>sosuke</b></span>
        <span class="version">v1.1.0 · macOS</span>
      </div>
    </div>
  </body>
</html>
