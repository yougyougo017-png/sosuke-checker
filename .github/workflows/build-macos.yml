name: Build macOS DMG

# Produces a universal (Intel + Apple Silicon) SOSUKE Checker .dmg and .zip.
# Run it from the Actions tab, or push a tag such as v1.1.0.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  dmg:
    name: Universal macOS build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tooling
        run: npm ci

      - name: Build unsigned DMG + ZIP
        if: ${{ env.MAC_CERTIFICATE == '' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --publish never

      - name: Build signed and notarized DMG + ZIP
        if: ${{ env.MAC_CERTIFICATE != '' }}
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
        run: npm run dist:mac -- --publish never

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: SOSUKE-Checker-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30

    env:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
