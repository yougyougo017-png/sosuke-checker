<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("../electron/ui/fonts/bebas-neue-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../electron/ui/fonts/jetbrains-mono-500.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1024px;
        height: 1024px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      .icon {
        position: absolute;
        top: 100px;
        left: 100px;
        width: 824px;
        height: 824px;
        overflow: hidden;
        border-radius: 186px;
        background:
          radial-gradient(ellipse at 50% 118%, #1b1b22 0%, #0b0b0f 58%, #060608 100%);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.13),
          inset 0 -40px 90px rgba(0, 0, 0, 0.52),
          0 26px 60px rgba(0, 0, 0, 0.32);
      }
      .icon::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(244, 241, 234, 0.075);
        border-radius: inherit;
        pointer-events: none;
      }
      .scan {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        background: repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.018) 3px,
          rgba(255, 255, 255, 0.018) 4px
        );
      }
      .ring {
        position: absolute;
        border-radius: 50%;
      }
      .ring-a {
        top: 86px;
        left: 86px;
        width: 652px;
        height: 652px;
        border: 2px solid rgba(244, 241, 234, 0.085);
      }
      .ring-b {
        top: 54px;
        left: 54px;
        width: 716px;
        height: 716px;
        border: 2px dashed rgba(244, 241, 234, 0.055);
      }
      .sun {
        position: absolute;
        top: 152px;
        left: 152px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 37% 31%,
          #ff955f 0%,
          #ff5429 34%,
          #e3330c 62%,
          #8c1c00 100%
        );
        box-shadow:
          0 0 110px rgba(255, 74, 36, 0.28),
          inset 0 0 50px rgba(0, 0, 0, 0.3);
      }
      .sun::after {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255, 210, 190, 0.18);
      }
      .letter {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding-top: 18px;
        color: #f4f1ea;
        font-family: "Bebas Neue";
        font-size: 520px;
        line-height: 1;
        text-shadow: 0 18px 55px rgba(0, 0, 0, 0.42);
      }
      .jp {
        position: absolute;
        top: 50%;
        right: 44px;
        transform: translateY(-50%);
        color: rgba(244, 241, 234, 0.22);
        font-family: "JetBrains Mono";
        font-size: 19px;
        letter-spacing: 0.42em;
        writing-mode: vertical-rl;
      }
      .wordmark {
        position: absolute;
        right: 0;
        bottom: 54px;
        left: 0;
        color: rgba(244, 241, 234, 0.32);
        font-family: "JetBrains Mono";
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.55em;
        text-align: center;
        text-indent: 0.55em;
      }
      .wordmark b {
        color: #ff4a24;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <span class="scan"></span>
      <span class="ring ring-a"></span>
      <span class="ring ring-b"></span>
      <span class="sun"></span>
      <span class="letter">S</span>
      <span class="jp">ススケ</span>
      <span class="wordmark"><b>/</b> SOSUKE</span>
    </div>
  </body>
</html>
